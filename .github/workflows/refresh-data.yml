name: Atualizar dados oficiais
on:
  schedule:
    - cron: '23 10 * * 1,3,5'
  workflow_dispatch:
    inputs:
      source:
        description: Base oficial a atualizar
        type: choice
        default: transit
        options: [transit, accidents, mco, vehicle-lines, neighborhoods, streets, traffic, radar]

permissions:
  contents: write

concurrency:
  group: refresh-official-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE: ${{ inputs.source || 'transit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -X utf8 scripts/ingest.py "$SOURCE"
      - if: env.SOURCE == 'neighborhoods'
        run: python scripts/map-preview.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar snapshot validado
        run: |
          git add -- data/"$SOURCE".json data/sources.json public/bh-bairros.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Atualiza snapshot oficial ($SOURCE)"
          git push origin HEAD:main
